<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Math Games</title>
<style>
  :root {
    --bg: #EAF6FF;
    --bg-deep: #D8EDFF;
    --ink: #2B2140;
    --ink-soft: #5B5270;
    --card: #FFFFFF;
    --frame: #C9E4FF;
    --grass: #3FBF7F;
    --shadow: 0 10px 24px -8px rgba(43, 33, 64, 0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171130;
      --bg-deep: #0F0B24;
      --ink: #F2ECFF;
      --ink-soft: #B8ACD9;
      --card: #241C42;
      --frame: #372A5C;
      --grass: #5CD696;
      --shadow: 0 10px 28px -8px rgba(0, 0, 0, 0.55);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 12% 8%, var(--bg-deep), transparent 42%),
      radial-gradient(circle at 88% 92%, var(--bg-deep), transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: 'Baloo 2', 'Segoe UI Rounded', 'SF Pro Rounded', ui-rounded, system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }

  .page {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  header {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  h1 {
    margin: 0;
    font-size: clamp(30px, 6vw, 42px);
    font-weight: 800;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  .subtitle {
    margin: 0;
    color: var(--ink-soft);
    font-size: clamp(14px, 3vw, 17px);
    font-weight: 600;
  }

  .games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
  }

  .game-card {
    background: var(--card);
    border-radius: 24px;
    padding: 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.15s ease;
  }

  .game-card:hover { transform: translateY(-4px); }
  .game-card:focus-visible { outline: 3px solid var(--grass); outline-offset: 3px; }

  .game-emoji {
    font-size: 40px;
    line-height: 1;
  }

  .game-title {
    font-size: 20px;
    font-weight: 800;
  }

  .game-desc {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 600;
    line-height: 1.4;
  }

  .play-pill {
    align-self: flex-start;
    margin-top: 4px;
    background: var(--grass);
    color: white;
    font-weight: 800;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 999px;
  }

  .more-note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>🧮 Kids Math Games</h1>
      <p class="subtitle">Free, playful games for learning math &mdash; pick one below!</p>
    </header>

    <div class="games">
      <a class="game-card" href="./square-number-adventure/">
        <span class="game-emoji">🔢</span>
        <span class="game-title">Square Number Adventure</span>
        <span class="game-desc">Tap blocks to count square numbers (1&times;1 up to 10&times;10), or try Quiz Time to test what you've learned.</span>
        <span class="play-pill">Play &rarr;</span>
      </a>
    </div>

    <p class="more-note">More games coming soon!</p>
  </div>
</body>
</html>
